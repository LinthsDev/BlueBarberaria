<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="página de compra.">
    <title>compra</title>
</head>
<body>

    <h1>Comprar Produto</h1>
    <a href="home.html">Home</a><p></p><a href="login.html">Login</a><p></p><a href="carrinho.html">Carrinho</a><p><a href="Produtos.html">Produtos</a></p><a href="Sobre.html">Sobre</a> 
    <hr>

    <form action="sucesso.html" method="GET">
        
        <label for="produto">Produto:</label><br>
        <select id="produto" name="produto" required>
            <option value="mouse">Mouse Manoel - R$ 59,90</option>
            <option value="mochila">Mochila Manoel - R$ 120,00</option>
            <option value="xicara">Xícara Manoel - R$ 35,00</option>
            <option value="almofada">Almofada Manoel - R$ 45,00</option>
            <option value="camisa">Camisa Manoel - R$ 89,90</option>
        </select>

        <br><br>

        <label for="quantidade">Quantidade:</label><br>
        <input type="number" id="quantidade" name="quantidade" value="1" min="1" required>

        <br><br>

        <label for="nome">Seu Nome:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <br><br>

        <label for="pagamento">Forma de Pagamento:</label><br>
        <select id="pagamento" name="pagamento" required>
            <option value="pix">Pix</option>
            <option value="cartao">Cartão de Crédito</option>
            <option value="boleto">Boleto</option>
        </select>

        <br><br>

        <button type="submit">Finalizar Compra</button>

    </form>

</body>
</html>
